<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="g" x1="5" y1="95" x2="95" y2="5" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0047cc"/>
      <stop offset="48%"  stop-color="#0080ff"/>
      <stop offset="100%" stop-color="#00c4ff"/>
    </linearGradient>
  </defs>

  <!-- Fundo escuro arredondado (legível em abas do browser) -->
  <rect width="100" height="100" rx="20" fill="#0d1117"/>

  <!-- K — haste vertical -->
  <rect x="11" y="8" width="15" height="84" rx="3" fill="url(#g)"/>

  <!-- K — braço superior -->
  <polygon points="26,36 26,50 83,20 83,8" fill="url(#g)"/>

  <!-- K — braço inferior -->
  <polygon points="26,50 26,64 83,92 83,80" fill="url(#g)"/>

  <!-- Candlestick 1 — wick + body -->
  <line x1="38" y1="29" x2="38" y2="58" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="34.5" y="36" width="7" height="15" rx="1.5" fill="url(#g)"/>

  <!-- Candlestick 2 — wick + body -->
  <line x1="50" y1="20" x2="50" y2="49" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="46.5" y="27" width="7" height="15" rx="1.5" fill="url(#g)"/>

  <!-- Candlestick 3 — wick + body -->
  <line x1="62" y1="11" x2="62" y2="40" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="58.5" y="18" width="7" height="15" rx="1.5" fill="url(#g)"/>

  <!-- Linha de tendência crescente -->
  <line x1="4" y1="83" x2="79" y2="19" stroke="url(#g)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Ponta de seta -->
  <polygon points="91,11 77,17 83,29" fill="url(#g)"/>
</svg>
